<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업노트</title>
<!-- 이 페이지는 색인하지 않는다. canonical 을 두었더니 Google 이 이 짧은 주소를 블로그 첫 페이지 대신
     대표로 골라 블로그 첫 페이지가 색인에서 빠졌다(2026-10-24 Search Console "Google에서 사용자와 다른 표준을 선택함") -->
<meta name="robots" content="noindex">
<!-- 화면 코드만 공개된다. 문서는 브라우저가 토큰으로 GitHub API 에서 직접 받는다.
     스크립트는 이 사이트 파일만, 요청은 api.github.com 만 허용한다(Mermaid 가 인라인 style 을 쓴다) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- 파비콘: 블로그와 같은 남색 바탕에 체크 목록(11-11). CSP img-src 'self' 로 허용된다 -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app/style.css">
<!-- mermaid(5.5MB)는 여기서 받지 않는다. 흐름도를 처음 그릴 때 draw.mjs 가 받아 온다(첫 화면이 기다리지 않게) -->
<script src="vendor/chart.umd.min.js" defer></script>
<script type="module" src="app/main.mjs"></script>
</head>
<body>
<main id="app" aria-live="polite"><p class="boot">작업노트를 여는 중입니다…</p></main>
</body>
</html>
